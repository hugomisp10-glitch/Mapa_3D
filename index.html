 map.addLayer({id:'rc',type:'line',source:'r',paint:{'line-color':'#fff','line-width':['interpolate',['linear'],['zoom'],8,5,15,10],'line-opacity':.85},layout:{'line-cap':'round'}});
 map.addLayer({id:'rl',type:'line',source:'r',paint:{'line-color':['match',['get','m'],'train',LC.train,'bus',LC.bus,LC.tram],'line-width':['interpolate',['linear'],['zoom'],8,2.5,15,5]},layout:{'line-cap':'round'}})}paintHL()});
map.on('error',e=>{const t=$('toast');t.textContent='Sem ligação aos mapas. Verifica a internet.';t.style.display='block';setTimeout(()=>t.style.display='none',4000)});
ALL.forEach(a=>{const e=document.createElement('div');e.className='mk';e.innerHTML=`<i style="background:${a.col}">${a.em}</i><b>${a.n.split(' (')[0]}</b>`;e.onclick=ev=>{ev.stopPropagation();show(a,1)};a.e=e;new maplibregl.Marker({element:e,anchor:'bottom'}).setLngLat([a.lon,a.lat]).addTo(map)});
const vis=()=>{const z=map.getZoom();ALL.forEach(a=>{a.e.classList.toggle('h',z<[0,9,10.5,12,14.5][a.pr]||(MKO&&!a.mk));a.e.classList.toggle('lb',z>=12.5)})};map.on('zoom',vis);vis();
const gm=(a,m)=>`https://www.google.com/maps/${m}`;
function show(a,fly){if(fly)map.flyTo({center:[a.lon,a.lat],zoom:Math.max(map.getZoom(),a.pr>=4?18:a.pr==0?14.5:16.5),pitch:62,bearing:map.getBearing()+25,duration:2200});
 const q=encodeURIComponent(a.n+(a.town?', '+a.town:'')+', France');
 $('shc').innerHTML=`<h2>${a.em} ${a.n}</h2><span class="tag">${a.tp}</span>${a.mk?'<span class="tag">🎄 Mercado de Natal</span>':''}<p>${a.d}</p>${a.h?`<p><b>Como chegar:</b> ${a.h}</p>`:''}${a.mk?`<p style="font-size:12px;color:#777">${MKT}</p>`:''}<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=walking">🚶 Ir a pé</a><a class="o" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">🗺 Google Maps</a><a class="o" target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${a.lat},${a.lon}">👁 Street View</a>`;$('sh').classList.add('o')}
$('x').onclick=()=>$('sh').classList.remove('o');map.on('click',()=>$('sh').classList.remove('o'));
// chips
const J=[['col','Colmar'],['str','Estrasburgo'],['egu','Eguisheim'],['rqw','Riquewihr'],['kay','Kaysersberg'],['baz','Basileia'],['mul','Mulhouse']];
$('ch').innerHTML=J.map(j=>`<button class="ch" data-j="${j[0]}">🔎 ${j[1]}</button>`).join('')+'<button class="ch" id="cm">🎄 Só mercados</button>';
$('ch').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='cm'){MKO=!MKO;b.classList.toggle('on',!!MKO);vis();return}const a=byId[b.dataset.j];map.flyTo({center:[a.lon,a.lat],zoom:15.6,pitch:64,bearing:map.getBearing()+30,duration:2800})};
// pesquisa
const q=$('q'),r=$('res');q.oninput=()=>{const v=q.value.trim().toLowerCase();if(v.length<2){r.style.display='none';return}const m=ALL.filter(a=>a.n.toLowerCase().includes(v)).slice(0,8);r.innerHTML=m.map(a=>`<div data-i="${ALL.indexOf(a)}">${a.em} ${a.n} <small>${a.town||a.tp}</small></div>`).join('')||'<div>Sem resultados</div>';r.style.display='block'};
r.onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;r.style.display='none';q.value='';q.blur();show(ALL[d.dataset.i],1)};
// ferramentas
$('b3').onclick=e=>{const on=map.getPitch()<10;map.easeTo({pitch:on?62:0,bearing:on?map.getBearing():0,duration:900});e.currentTarget.classList.toggle('on',on)};
$('bo').onclick=e=>{orb=!orb;e.currentTarget.classList.toggle('on',!!orb);const f=()=>{if(!orb)return;map.setBearing(map.getBearing()+.12);requestAnimationFrame(f)};if(orb)f()};
map.on('dragstart',()=>{orb=0;$('bo').classList.remove('on')});
$('bs').onclick=()=>{si=(si+1)%3;map.setStyle(STY[si])};
// trajetos + Pai Natal animado
let sa=null,raf=0;
function santa(c){cancelAnimationFrame(raf);if(!c.length)return;if(!sa){const e=document.createElement('div');e.className='santa';e.textContent='🎅🛷';sa=new maplibregl.Marker({element:e}).setLngLat(c[0]).addTo(map)}
 const n=c.length-1,dur=4500*n,t0=performance.now();const f=t=>{const u=((t-t0)%dur)/dur*n,i=Math.min(n-1,Math.floor(u)),k=u-i;sa.setLngLat([c[i][0]+(c[i+1][0]-c[i][0])*k,c[i][1]+(c[i+1][1]-c[i][1])*k]);raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
function route(i){const t=TJ[i];HL=t[3];paintHL();let c=[];t[3].forEach(li=>{const s=L[li][2].map(id=>[byId[id].lon,byId[id].lat]);c=c.concat(s)});
 const b=c.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(c[0],c[0]));map.fitBounds(b,{padding:{top:40,bottom:260,left:40,right:60},pitch:45,duration:1800,maxZoom:13});santa(c);
 $('shc').innerHTML=`<h2>🧭 ${t[0]}</h2><span class="tag">${t[1]}</span><p>${t[2]}</p><p style="font-size:12px;color:#777">Confirma sempre linhas e horários.</p><button class="b" onclick="lista()">← Todos os trajetos</button>`}
function lista(){HL=[];paintHL();cancelAnimationFrame(raf);if(sa){sa.remove();sa=null}$('shc').innerHTML='<h2>🧭 Trajetos</h2>'+TJ.map((t,i)=>`<div class="tj" onclick="route(${i})"><b>${t[0]}</b><br><small>${t[1]}</small></div>`).join('');$('sh').classList.add('o')}
$('bt').onclick=lista;
</script></body></html>
