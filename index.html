const pt=new Map();let pd=0;S.onpointerdown=e=>{S.setPointerCapture(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);if(pt.size==2){const[a,b]=[...pt.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}};
S.onpointermove=e=>{if(!pt.has(e.pointerId))return;const o=pt.get(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);if(pt.size==2){const[a,b]=[...pt.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);zoom(d/pd,(a[0]+b[0])/2,(a[1]+b[1])/2);pd=d}else{tx+=e.clientX-o[0];ty+=e.clientY-o[1];ap()}};
S.onpointerup=S.onpointercancel=e=>pt.delete(e.pointerId);addEventListener('resize',()=>el.classList.contains('o')&&fit());
})();
